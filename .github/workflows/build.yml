name: Build plugin

# 每次 push 都会构建出可直接给 Jellyfin 使用的插件包（workflow artifact）。
# 打 tag（如 v0.2.0.0）或手动 dispatch 勾选 publish 时，会把插件包与 manifest.json
# 一起发布到 docs/ 并创建 GitHub Release；用户在 Jellyfin 里添加一次存储库地址即可自动更新：
#   https://raw.githubusercontent.com/<owner>/<repo>/<默认分支>/docs/manifest.json
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号（如 0.2.0.0；留空则自动生成 dev 版本 x.y.z.<run_number>）"
        required: false
        default: ""
      publish:
        description: "发布 GitHub Release 并更新插件仓库 manifest"
        type: boolean
        default: false
      backfill_version:
        description: "只回填某个已发布版本的 Release 说明（如 0.3.0.0；填了就跳过正常构建）"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # 统一 UTF-8，避免非英文描述在解析/打包时受系统区域设置影响
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # 手动回填历史版本的 Release 说明（不重新编译）：Actions → Run workflow → backfill_version
  backfill-notes:
    name: 回填 Release 说明
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 用 CHANGELOG.md 更新对应 Release 说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKFILL: ${{ github.event.inputs.backfill_version }}
        run: |
          set -euo pipefail
          version="$(python3 ci/changelog.py --version "$BACKFILL" --print-version)"
          python3 ci/changelog.py --version "$version" --format full --require > release-notes.md
          echo "----- v${version} 的更新说明 -----"
          cat release-notes.md
          gh release edit "v${version}" --notes-file release-notes.md
          echo "已更新: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}"

  build:
    name: 构建与打包
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_version != '') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析版本号
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -euo pipefail
          manual="${INPUT_VERSION:-}"
          publish="${INPUT_PUBLISH:-false}"

          if [[ -n "$manual" ]]; then
            raw="$manual"
            release="$publish"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            raw="${GITHUB_REF#refs/tags/v}"
            release="true"
          else
            base="$(python3 -c "import json,pathlib;print(json.loads(pathlib.Path('plugin.json').read_text(encoding='utf-8'))['version'])")"
            IFS='.' read -r v1 v2 v3 v4 <<< "$base"
            base="${v1:-0}.${v2:-0}.${v3:-0}.${v4:-0}"
            dev="$(echo "$base" | cut -d. -f1-3).${GITHUB_RUN_NUMBER}"

            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              raw="$dev"; release="false"
            elif git ls-remote --exit-code --tags origin "refs/tags/v${base}" >/dev/null 2>&1; then
              raw="$dev"; release="false"
              echo "v${base} 已经发布过，本次只产出开发构建产物"
            else
              raw="$base"; release="true"
              echo "plugin.json 里是新版本 v${base}，将自动发布 Release"
            fi
          fi

          IFS='.' read -r a b c d <<< "$raw"
          version="${a:-0}.${b:-0}.${c:-0}.${d:-0}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release=$release" >> "$GITHUB_OUTPUT"
          echo "版本: $version (release=$release)"

      - name: 还原依赖
        run: dotnet restore Jellyfin.Plugin.StrmTrickplay/Jellyfin.Plugin.StrmTrickplay.csproj

      - name: 解析器冒烟测试
        run: dotnet run --project tests/ParserSmokeTest/ParserSmokeTest.csproj -c Release

      - name: CI 脚本自测（版本判定 / 更新说明提取）
        shell: bash
        run: |
          set -euo pipefail
          for test_script in ci/tests/*.test.sh; do
            echo "== $test_script =="
            bash "$test_script"
          done

      - name: 提取更新说明
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            # 发版必须带更新说明：CHANGELOG.md 缺对应小节则直接失败，避免发布"没有说明"的版本
            python3 ci/changelog.py --version "$VERSION" --format full --require > release-notes.md
          else
            # 开发构建：没有小节时回退成提交信息
            python3 ci/changelog.py --version "$VERSION" --format full > release-notes.md 2>/dev/null || true
            if [[ ! -s release-notes.md ]]; then
              printf '开发构建（未发布）：%s\n' "$(git log -1 --pretty=%s)" > release-notes.md
            fi
          fi
          echo "----- 本次版本的更新说明 -----"
          cat release-notes.md
          {
            echo "## 更新说明（v${VERSION}）"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          summary="$(python3 ci/changelog.py --version "$VERSION" --format summary 2>/dev/null || true)"
          if [[ -z "$summary" ]]; then summary="$(git log -1 --pretty=%s)"; fi
          echo "summary<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: 构建并打包插件
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/package.py --version "${{ steps.version.outputs.version }}" --changelog "${{ steps.changelog.outputs.summary }}"

      - name: 展示产物
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/*.zip
          cat dist/*.md5
          (cd dist && md5sum -c ./*.md5)
          cat dist/build-info.json

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: strm-trickplay-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.md5
            dist/*.sha256
            dist/meta.json
            dist/build-info.json
          if-no-files-found: error

  release:
    name: 发布插件包与仓库清单
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支（用于把 docs/ 提交回去）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载插件包
        uses: actions/download-artifact@v4
        with:
          name: strm-trickplay-${{ needs.build.outputs.version }}
          path: dist

      - name: 生成 Release 说明
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 ci/changelog.py --version "$VERSION" --format full --require > release-notes.md
          summary="$(python3 ci/changelog.py --version "$VERSION" --format summary --require)"
          md5_line="$(cat dist/*.md5 2>/dev/null || true)"
          sha_line="$(cat dist/*.sha256 2>/dev/null || true)"
          {
            echo
            echo "---"
            echo
            echo "### 安装 / 升级"
            echo
            echo "- 已添加插件存储库：Jellyfin 控制台 → 插件 → 目录 → 升级"
            printf -- '- 存储库地址：%s\n' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/docs/manifest.json"
            printf -- '- 手动安装：下载下方 strm-trickplay_%s.zip，解压到 Jellyfin 插件目录后重启（见 README 第 2 节）\n' "$VERSION"
            echo
            echo "### 校验"
            echo
            printf -- '```\n%s\n%s\n```\n' "$md5_line" "$sha_line"
          } >> release-notes.md
          echo "----- Release 说明 -----"
          cat release-notes.md
          {
            echo "## 已发布 v${VERSION}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "summary<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: 更新 docs/（插件包 + 仓库清单）
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 ci/publish.py --skip-build --version "$VERSION" --branch "$BRANCH" \
            --changelog "${{ steps.notes.outputs.summary }}"

      - name: 提交并推送 docs/
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ 无变化，跳过提交"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: 发布 v${VERSION} 插件包与仓库清单 [skip ci]"
          git push origin "HEAD:${BRANCH}"

      - name: 创建 GitHub Release（附件：插件包 + 校验文件）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          read_info() {
            python3 -c "import json,pathlib,sys;print(json.loads(pathlib.Path('dist/build-info.json').read_text(encoding='utf-8')).get(sys.argv[1],''))" "$1"
          }

          zip="$(read_info zip)"
          md5file="$(read_info md5File)"
          shafile="$(read_info sha256File)"
          assets=("dist/$zip" "dist/build-info.json")
          if [[ -n "$md5file" && -f "dist/$md5file" ]]; then assets+=("dist/$md5file"); fi
          if [[ -n "$shafile" && -f "dist/$shafile" ]]; then assets+=("dist/$shafile"); fi

          echo "Release 附件:"; printf '  %s\n' "${assets[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            # 同一版本重复发布时，说明也一并刷新，避免留下旧内容
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
            echo "已刷新 Release 说明"
          else
            target_args=()
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              target_args=(--target "${GITHUB_SHA}")
            fi
            gh release create "$tag" "${target_args[@]}" "${assets[@]}" --title "$tag" \
              --notes-file release-notes.md
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

      - name: 输出存储库地址
        shell: bash
        run: |
          echo "在 Jellyfin 中添加插件存储库（控制台 → 插件 → 存储库 → 添加）："
          echo "  https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ github.event.repository.default_branch }}/docs/manifest.json"
          echo "开启 Pages（分支 ${{ github.event.repository.default_branch }} + 目录 /docs）后也可用："
          echo "  https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/manifest.json"

